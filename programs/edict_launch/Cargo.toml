[package]
name = "edict_launch"
version = "0.1.0"
description = "Edict on Raydium LaunchLab: one LaunchLab platform per token owned by a program PDA, per-pool fee claims forwarded to the token's vault, and the $EDICT fee schedule (docs/validation/EDICT_LAUNCH.md)."
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "edict_launch"

[features]
# no-log-ix-name: no "Instruction: <name>" log line per call (size; nothing reads that line)
default = ["no-log-ix-name"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Exact pin, the same cohort as edict_seals. `event-cpi`: every event that feeds the books is an inner-instruction event.
# No anchor-spl: the few token reads and the one transfer are fixed layouts written by hand (size).
anchor-lang = { version = "=1.2.1", features = ["event-cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
bincode = "=1.3.3"
sha2 = "=0.10.9"
